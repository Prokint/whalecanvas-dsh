name: clean-macos-metadata
on:
  push:
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove AppleDouble files
        run: |
          find . -name '._*' -delete
          rm -f .github/workflows/clean-macos-metadata.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove macOS metadata" || exit 0
          git push
